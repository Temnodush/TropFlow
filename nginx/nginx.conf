# =============================================================================
#  Nginx для проекта TropFlow (работает внутри своего контейнера).
#
#  Схема: браузер → Nginx (порт 80) → Gunicorn (web:8000) → Django.
#  Порт 8000 наружу не публикуется: снаружи приложение доступно только
#  через Nginx, который слушает WEB_PORT на хост-машине.
#
#  Файл монтируется в контейнер как /etc/nginx/nginx.conf (см. docker-compose.yml),
#  поэтому здесь описаны все нужные секции: events, http и server.
#
#  server_name _ означает «любой хост»: этого достаточно для доступа по IP.
#  Если появится домен — замените _ на него.
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Ограничение размера загружаемых файлов (по умолчанию в Nginx всего 1 МБ)
    client_max_body_size 10m;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/atom+xml image/svg+xml;

    # web — имя сервиса в docker-compose: Nginx находит его через DNS docker-сети
    upstream django {
        server web:8000;
        keepalive 16;
    }

    server {
        listen       80;
        server_name  _;

        # --- Статика Django (результат collectstatic) --------------------------
        # Том static_data смонтирован в Nginx только для чтения
        location /static/ {
            alias /app/staticfiles/;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # --- Медиафайлы, загруженные пользователями -----------------------------
        location /media/ {
            alias /app/media/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # --- Проверка живости сервиса (используется healthcheck контейнера) -----
        location = /health/ {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 'ok';
        }

        # --- Всё остальное уходит в Gunicorn ------------------------------------
        location / {
            proxy_pass         http://django;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   Connection        "";
            proxy_redirect     off;

            proxy_connect_timeout 60s;
            proxy_read_timeout    120s;
        }

        # Заголовки безопасности уровня приложения
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "same-origin" always;
    }
}
