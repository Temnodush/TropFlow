# =============================================================================
#  CI/CD пайплайн проекта TropFlow.
#
#  Этапы (каждый следующий запускается только при успехе предыдущего):
#    1. lint    — flake8, статический анализ кода
#    2. test    — тесты на PostgreSQL (как на боевом сервере) + покрытие
#    3. build   — сборка Docker-образа и проверка конфигурации compose
#    4. deploy  — выкладка на сервер по SSH: git pull → docker compose up -d --build
#
#  Деплой идёт только при push в ветку develop: pull request-ы проверяются
#  без выкладки (см. условие if в job deploy).
#
#  Секреты репозитория (Settings → Secrets and variables → Actions):
#    SERVER_IP           — публичный IP сервера
#    SSH_USER            — пользователь для SSH-подключения
#    SSH_KEY             — приватный SSH-ключ для входа на сервер
#    DEPLOY_DIR          — каталог проекта на сервере (например /opt/tropflow)
#    SECRET_KEY_DJANGO   — секретный ключ Django
#    POSTGRES_DB         — имя базы данных
#    POSTGRES_USER       — пользователь базы данных
#    POSTGRES_PASSWORD   — пароль базы данных
#    TELEGRAM_BOT_TOKEN  — токен Telegram-бота
# =============================================================================

name: TropFlow CI/CD

on:
  push:
  pull_request:
  # Ручной запуск кнопкой Run workflow на вкладке Actions
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  #  1. Линтер
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.3.0

      - name: Run flake8
        run: flake8 .

  # ---------------------------------------------------------------------------
  #  2. Тесты на реальной PostgreSQL и Redis
  # ---------------------------------------------------------------------------
  test:
    name: Tests (Django + PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tropflow
          POSTGRES_USER: tropflow
          POSTGRES_PASSWORD: tropflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tropflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Ключ только для тестов: длиннее 32 байт, чтобы не было
      # предупреждения InsecureKeyLengthWarning от PyJWT
      SECRET_KEY_DJANGO: ci-only-secret-key-for-tests-0123456789abcdefghijklmnop
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      TIME_ZONE: Asia/Yekaterinburg
      TELEGRAM_BOT_TOKEN: '000000000:CI-TEST-TOKEN'
      DB_NAME: tropflow
      DB_USER: tropflow
      DB_PASSWORD: tropflow
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Run tests with coverage
        run: |
          coverage run -m pytest -q
          coverage report -m

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  #  3. Сборка Docker-образа: проверяем, что образ вообще собирается
  # ---------------------------------------------------------------------------
  build:
    name: Build (Docker image)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: false
          load: true
          tags: tropflow-web:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build all stack images
        run: docker compose build

      - name: Validate compose config
        env:
          SECRET_KEY_DJANGO: ci-only-secret-key
          POSTGRES_PASSWORD: ci-only-password
        run: docker compose config --quiet

      - name: Check entrypoint syntax
        run: sh -n docker/entrypoint.sh

  # ---------------------------------------------------------------------------
  #  4. Деплой на сервер
  #      Только при push в develop: pull request-ы не деплоятся.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Create and copy .env to server
        run: |
          cat > .env <<'EOF'
          DEBUG=False
          DJANGO_SETTINGS_MODULE=config.settings
          SECRET_KEY_DJANGO=${{ secrets.SECRET_KEY_DJANGO }}
          ALLOWED_HOSTS=${{ secrets.SERVER_IP }},localhost,127.0.0.1
          CSRF_TRUSTED_ORIGINS=http://${{ secrets.SERVER_IP }}
          CORS_ALLOWED_ORIGINS=http://${{ secrets.SERVER_IP }}
          TIME_ZONE=Asia/Yekaterinburg
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          REDIS_HOST=redis
          REDIS_PORT=6379
          WEB_PORT=80
          GUNICORN_WORKERS=3
          EOF
          sed -i 's/^ *//' .env
          chmod 600 .env
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes .env \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.DEPLOY_DIR }}/.env

      - name: Pull changes and restart containers
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          set -e
          cd ${{ secrets.DEPLOY_DIR }}
          git fetch --prune origin
          git checkout --force develop
          git reset --hard origin/develop
          docker compose up -d --build --remove-orphans
          docker compose ps
          EOF

      - name: Check application after deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          set -e
          cd ${{ secrets.DEPLOY_DIR }}
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 10 http://127.0.0.1/health/; then
              echo "Приложение отвечает"
              curl -s -o /dev/null -w "HTTP-код Swagger: %{http_code}\n" http://127.0.0.1/swagger/
              exit 0
            fi
            echo "попытка ${attempt}: приложение ещё не отвечает"
            sleep 10
          done
          echo "Приложение не поднялось, логи:"
          docker compose logs --no-color --tail=80
          exit 1
          EOF
